name: CI/CD - Build images and deploy

concurrency:
  group: prod-deploy
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "nginx/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/ci-cd-prod.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: ruff check backend/app

      - name: Run Ruff (format check)
        run: ruff format --check backend/app || true

      - name: Run MyPy
        run: |
          export PYTHONPATH=backend
          mypy backend/app

  build-backend:
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/dominik-farlik/nchls-backend:latest
            ghcr.io/dominik-farlik/nchls-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: ./frontend
      - name: Run ESLint & TypeScript check
        run: |
          npm run lint
          npx tsc --noEmit
        working-directory: ./frontend

  build-frontend:
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/dominik-farlik/nchls-frontend:latest
            ghcr.io/dominik-farlik/nchls-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    steps:
      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Set up SSH key and config
        run: |
          mkdir -p ~/.ssh
          # Vložení privátního klíče
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Konfigurace SSH pro použití Cloudflare tunelu
          cat << 'EOF' > ~/.ssh/config
          Host ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy application
        run: |
          ssh ${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -euo pipefail
            cd /home/dominikfarlik/nchls
          
            # Přihlášení k GHCR pomocí GitHub Tokenu
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
          EOF