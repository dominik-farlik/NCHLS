services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  fastapi:
    image: ghcr.io/dominik-farlik/nchls-backend:latest
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/uploads

  nginx:
    image: ghcr.io/dominik-farlik/nchls-frontend:latest
    restart: always
    depends_on:
      - fastapi
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data: